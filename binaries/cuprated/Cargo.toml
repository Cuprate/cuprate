[package]
name = "cuprated"
version = "0.1.0-preview"
edition = "2021"
description = "The Cuprate Rust Monero node."
license = "AGPL-3.0-only"
authors = ["Boog900", "hinto-janai", "SyntheticBird45"]
repository = "https://github.com/Cuprate/cuprate/tree/main/binaries/cuprated"

[lib]
name = "cuprated"

[[bin]]
name = "cuprated"

[features]
default = ["arti"]
arti = ["arti-client", "tor-hsservice", "tor-persist", "tor-rtcompat", "cuprate-p2p-transport/arti", "dep:safelog"]
mimalloc = ["dep:mimalloc"]
mimalloc-secure = ["mimalloc", "mimalloc/secure"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
# TODO: after v1.0.0, remove unneeded dependencies.
cuprate-address-book      = { workspace = true }
cuprate-blockchain        = { workspace = true, features = ["serde"] }
cuprate-consensus-context = { workspace = true }
cuprate-consensus-rules   = { workspace = true }
cuprate-consensus         = { workspace = true }
cuprate-constants         = { workspace = true, features = ["build", "rpc"] }
cuprate-cryptonight       = { workspace = true }
cuprate-dandelion-tower   = { workspace = true, features = ["txpool"] }
cuprate-fast-sync         = { workspace = true }
cuprate-fixed-bytes       = { workspace = true }
cuprate-helper            = { workspace = true, features = ["std", "serde", "time", "net"] }
cuprate-hex               = { workspace = true }
cuprate-p2p-core          = { workspace = true }
cuprate-p2p-transport     = { workspace = true }
cuprate-p2p               = { workspace = true }
cuprate-rpc-interface     = { workspace = true, features = ["dummy"] }
cuprate-rpc-types         = { workspace = true, features = ["from"] }
cuprate-txpool            = { workspace = true }
cuprate-types             = { workspace = true, features = ["json"] }
cuprate-wire              = { workspace = true, features = ["serde"] }

# TODO: after v1.0.0, remove unneeded dependencies.
axum                  = { workspace = true, features = ["tokio", "http1"] }
anyhow                = { workspace = true }
arti-client           = { workspace = true, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "static"], optional = true }
borsh                 = { workspace = true }
bytes                 = { workspace = true }
clap                  = { workspace = true, features = ["cargo", "help", "wrap_help", "usage", "error-context", "suggestions"] }
const_format          = { workspace = true, features = ["all"] }
dashmap               = { workspace = true }
fjall                 = { workspace = true }
futures               = { workspace = true }
hex                   = { workspace = true }
hyper                 = { workspace = true }
hyper-util            = { workspace = true }
indexmap              = { workspace = true }
mimalloc              = { workspace = true, optional = true }
monero-address        = { workspace = true }
monero-oxide          = { workspace = true, features = ["std", "compile-time-generators"] }
nu-ansi-term          = { workspace = true }
pin-project-lite      = { workspace = true }
rayon                 = { workspace = true }
safelog               = { workspace = true, optional = true }
serde_json            = { workspace = true }
serde                 = { workspace = true }
sysinfo               = { workspace = true, features = ["system"] }
thiserror             = { workspace = true }
tokio-util            = { workspace = true, features = ["rt"] }
tokio                 = { workspace = true }
toml                  = { workspace = true, features = ["parse", "display", "serde"]}
toml_edit             = { workspace = true, features = ["parse", "display"] }
tor-hsservice         = { workspace = true, optional = true }
tor-persist           = { workspace = true, optional = true }
tor-rtcompat          = { workspace = true, optional = true }
tower                 = { workspace = true, features = ["limit"] }
tower-http            = { workspace = true, features = ["limit", "timeout", "trace"] }
tracing-appender      = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["std", "fmt", "default"] }
tracing               = { workspace = true, features = ["default"] }

# `jemalloc` does not support MSVC, and FreeBSD already uses it.
[target.'cfg(not(any(target_env = "msvc", target_os = "freebsd")))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
tempfile          = { workspace = true }
pretty_assertions = { workspace = true }
rand               = { workspace = true }

[build-dependencies]
cuprate-hex = { workspace = true }
serde_json  = { workspace = true, features = ["std"] }

[lints]
workspace = true
