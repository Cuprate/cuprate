[package]
name = "cuprate-helper"
version = "0.1.0"
edition = "2021"
description = "Helper functions used around Cuprate."
license = "MIT"
authors = ["hinto-janai <hinto.janai@protonmail.com>", "Boog900"]
repository = "https://github.com/Cuprate/cuprate/tree/main/consensus"


[features]
# All features off by default.
default   = []
std       = []
asynch    = ["dep:futures", "dep:rayon"]
cast      = []
crypto    = ["dep:curve25519-dalek", "dep:monero-oxide", "std"]
fs        = ["dep:dirs", "std", "dep:target_os_lib"]
num       = []
map       = []
time      = ["dep:chrono", "std"]
tx        = ["dep:monero-oxide"]
fmt       = ["map", "std"]

[dependencies]
chrono           = { workspace = true, optional = true, features = ["std", "clock"] }
curve25519-dalek = { workspace = true, optional = true }
dirs             = { workspace = true, optional = true }
futures          = { workspace = true, optional = true, features = ["std"] }
monero-oxide     = { workspace = true, optional = true }
rayon            = { workspace = true, optional = true }

serde            = { workspace = true, optional = true, features = ["derive"] }

# [fs] needs libc on unix.
[target.'cfg(unix)'.dependencies]
target_os_lib = { package = "libc", version = "0.2", optional = true }

[dev-dependencies]
tokio            = { workspace = true, features = ["full"] }
curve25519-dalek = { workspace = true }
proptest          = { workspace = true }

[lints]
workspace = true
