[package]
name        = "cuprate-types"
version     = "0.0.0"
edition     = "2021"
description = "Cuprate data types"
license     = "MIT"
authors     = ["hinto-janai"]
repository  = "https://github.com/Cuprate/cuprate/tree/main/types"
keywords    = ["cuprate", "types"]

[features]
default    = ["epee", "serde", "rpc"]
epee       = ["dep:cuprate-epee-encoding", "cuprate-json?/epee"]
serde      = ["dep:serde", "cuprate-json?/serde"]
proptest   = ["dep:proptest",  "dep:proptest-derive"]
rpc        = ["dep:cuprate-hex", "dep:cuprate-json"]

[dependencies]
cuprate-epee-encoding = { workspace = true, optional = true, features = ["std"] }
cuprate-fixed-bytes   = { workspace = true, features = ["std", "serde"] }
cuprate-hex           = { workspace = true, optional = true }
cuprate-json          = { workspace = true, optional = true }

bitflags         = { workspace = true }
bytes            = { workspace = true }
cfg-if           = { workspace = true }
monero-oxide     = { workspace = true }
serde            = { workspace = true, features = ["std", "derive"], optional = true }
strum            = { workspace = true, features = ["derive"] }
thiserror        = { workspace = true }

proptest = { workspace = true, optional = true }
proptest-derive  = { workspace = true, optional = true }

[dev-dependencies]
serde_json        = { workspace = true, features = ["std"] }

[lints]
workspace = true
