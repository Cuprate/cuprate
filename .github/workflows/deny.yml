# This runs `cargo deny check` on all dependencies (only if Cargo deps changed)

name: Deny

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The version of `cargo-deny` to install and use.
  CARGO_DENY_VERSION: 0.20.2

jobs:
  audit:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-deny
        key: cargo-deny-bin-${{ env.CARGO_DENY_VERSION }}
    - name: Add cargo-deny to PATH
      run: echo "${{ runner.tool_cache }}/cargo-deny/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: cargo install --locked --version ${{ env.CARGO_DENY_VERSION }} --root "${{ runner.tool_cache }}/cargo-deny" cargo-deny
    - name: Deny
      run: cargo deny check
