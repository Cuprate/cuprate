# This runs `cargo deny check` on all dependencies (only if Cargo deps changed)

name: Deny

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The version of `cargo-deny` to install and use.
  CARGO_DENY_VERSION: 0.20.2

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustcache-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}
          # as this workflow only runs when dependencies change, the lockfile
          # hash would change on every run and prevent cache hits
          add-rust-environment-hash-key: false
          cache-directories: ~/.cargo/advisory-dbs
          # This job does not build the workspace.
          cache-targets: false
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version ${{ env.CARGO_DENY_VERSION }} cargo-deny
      - name: Deny
        run: cargo deny check
